version: 2
updates:
  # Python packages pinned in requirements.txt / requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"

  # GitHub Actions used by CI (checkout, setup-python, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

# Note: the base images are distroless tags like "nonroot" / "debian13",
# which are not semantic versions, so Dependabot cannot version-bump them.
# See README section 7 for how to update base images (or use Renovate).
