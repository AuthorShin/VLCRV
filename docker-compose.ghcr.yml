# Pull the published image from GHCR instead of building locally:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
services:
  vlc-remote:
    image: ghcr.io/authorshin/vlcrv:latest
    container_name: vlc-remote-control
    restart: unless-stopped

    # Host networking makes the container reachable at the VM's LAN IP.
    network_mode: host

    environment:
      VLC_HOST: ${VLC_HOST:-Your-PC}
      VLC_HTTP_PORT: ${VLC_HTTP_PORT:-8080}
      VLC_HTTP_PASSWORD: ${VLC_HTTP_PASSWORD:-changeme}
      PORT: ${PORT:-8004}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED: "1"

    volumes:
      - remote-config:/app/data

    healthcheck:
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8004') + '/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  remote-config:
